name: Build Othman Cash APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and extract source ZIP
        run: |
          if [ ! -f othman-cash-source.zip ]; then
            echo "ERROR: othman-cash-source.zip is missing from the repository root."
            exit 1
          fi
          mkdir app-source
          unzip -q othman-cash-source.zip -d app-source
          cp -a app-source/. .
          rm -rf app-source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: |
          npm install @capacitor/android@^8.5.3 --legacy-peer-deps
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Othman-Cash-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
